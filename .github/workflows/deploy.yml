name: Deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore SaluExamPortal.csproj

    - name: Publish Self-Contained Application
      run: dotnet publish SaluExamPortal.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Inject Production Settings
      shell: pwsh
      run: |
        $config = @{
          "ConnectionStrings" = @{
            "DefaultConnection" = "${{ secrets.DB_CONNECTION_STRING }}"
          }
          "Logging" = @{
            "LogLevel" = @{
              "Default" = "Information"
              "Microsoft.AspNetCore" = "Warning"
            }
          }
          "AllowedHosts" = "*"
          "SeedAdmin" = @{
            "Email" = "admin@salu.edu.pk"
            "Password" = "${{ secrets.SEED_ADMIN_PASSWORD || 'AdminPassword123!' }}"
          }
          "Security" = @{
            "AdmitCardHmacSecret" = "${{ secrets.ADMIT_CARD_SECRET || 'ProductionSecretKey_SaluExamPortal_2026_Secure' }}"
          }
        } | ConvertTo-Json -Depth 5
        Set-Content -Path ./publish/appsettings.Production.json -Value $config

    - name: Ensure logs folder exists
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ./publish/logs | Out-Null

    - name: Deploy via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: ${{ secrets.FTP_REMOTE_DIR || 'site/wwwroot/' }}
        dangerous-clean-slate: false
