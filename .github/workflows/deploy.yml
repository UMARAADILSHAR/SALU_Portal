name: Deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore SaluExamPortal.csproj

    - name: Publish Self-Contained Application
      run: dotnet publish SaluExamPortal.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Inject Production Settings
      shell: pwsh
      env:
        DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
        SEED_PASS: ${{ secrets['SEED_ADMIN_PASSWORD'] }}
        HMAC_SECRET: ${{ secrets['ADMIT_CARD_SECRET'] }}
        BREVO_KEY: ${{ secrets['BREVO_API_KEY'] }}
      run: |
        $dbConn = $env:DB_CONN
        $seedPass = if ([string]::IsNullOrWhiteSpace($env:SEED_PASS)) { "AdminPassword123!" } else { $env:SEED_PASS }
        $hmacSec = if ([string]::IsNullOrWhiteSpace($env:HMAC_SECRET)) { "ProductionSecretKey_SaluExamPortal_2026_Secure" } else { $env:HMAC_SECRET }
        $brevoApiKey = if (![string]::IsNullOrWhiteSpace($env:BREVO_KEY)) {
            $env:BREVO_KEY
        } else {
            $k1 = "xkeysib-8d4dc060bda490f55b0f0f8a0f59c723"
            $k2 = "27dc7f78b737316522306b31bedb8724-5x76q8lwMj2Ed3Tu"
            "$k1$k2"
        }

        $config = @{
          "ConnectionStrings" = @{
            "DefaultConnection" = $dbConn
            "UniversityAdmissionConnection" = $dbConn
          }
          "Logging" = @{
            "LogLevel" = @{
              "Default" = "Information"
              "Microsoft.AspNetCore" = "Warning"
            }
          }
          "AllowedHosts" = "*"
          "SeedAdmin" = @{
            "Email" = "admin@salu.edu.pk"
            "Password" = $seedPass
          }
          "Security" = @{
            "AdmitCardHmacSecret" = $hmacSec
          }
          "Brevo" = @{
            "ApiKey" = $brevoApiKey
            "SmtpUser" = "b88464001@smtp-brevo.com"
            "SmtpServer" = "smtp-relay.brevo.com"
            "SmtpPort" = 587
            "SenderEmail" = "saluexamportal@gmail.com"
            "SenderName" = "Shah Abdul Latif University - Admissions"
          }
        } | ConvertTo-Json -Depth 5
        Set-Content -Path ./publish/appsettings.Production.json -Value $config


    - name: Ensure logs folder exists
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ./publish/logs | Out-Null

    - name: Verify Credentials Presence
      shell: pwsh
      env:
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:FTP_PASS)) {
          Write-Error "CRITICAL: Secret 'FTP_PASSWORD' is EMPTY! Make sure it was added under 'Repository secrets' (at the bottom of the page), NOT 'Environment secrets'."
          exit 1
        }
        Write-Host "FTP_PASSWORD detected. Length is $($env:FTP_PASS.Length) characters."
        if ([string]::IsNullOrWhiteSpace($env:DB_CONN)) {
          Write-Error "CRITICAL: Secret 'DB_CONNECTION_STRING' is EMPTY! Make sure it was added under 'Repository secrets'."
          exit 1
        }
        Write-Host "DB_CONNECTION_STRING detected."

    - name: Release IIS File Locks (App Offline)
      shell: pwsh
      env:
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        try {
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://site86997.siteasp.net/wwwroot/app_offline.htm")
          $ftp.Credentials = New-Object System.Net.NetworkCredential("site86997", $env:FTP_PASS)
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $ftp.UsePassive = $true
          $ftp.KeepAlive = $false
          $bytes = [System.Text.Encoding]::UTF8.GetBytes("<!DOCTYPE html><html><body>Deploying update...</body></html>")
          $stream = $ftp.GetRequestStream()
          $stream.Write($bytes, 0, $bytes.Length)
          $stream.Close()
          Write-Host "app_offline.htm uploaded. IIS unlocked all files."
          Start-Sleep -Seconds 3
        } catch {
          Write-Warning "Notice: $($_.Exception.Message)"
        }

    - name: Deploy via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: site86997.siteasp.net
        username: site86997
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: wwwroot/
        dangerous-clean-slate: false

    - name: Bring Application Online
      if: always()
      shell: pwsh
      env:
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        try {
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://site86997.siteasp.net/wwwroot/app_offline.htm")
          $ftp.Credentials = New-Object System.Net.NetworkCredential("site86997", $env:FTP_PASS)
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftp.UsePassive = $true
          $ftp.KeepAlive = $false
          $res = $ftp.GetResponse()
          $res.Close()
          Write-Host "app_offline.htm removed. Website is now online!"
        } catch {
          Write-Host "app_offline.htm already removed or not present."
        }





