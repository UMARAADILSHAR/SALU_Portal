name: Deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore SaluExamPortal.csproj

    - name: Publish Self-Contained Application
      run: dotnet publish SaluExamPortal.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Inject Production Settings
      shell: pwsh
      env:
        DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
        SEED_PASS: ${{ secrets.SEED_ADMIN_PASSWORD }}
        HMAC_SECRET: ${{ secrets.ADMIT_CARD_SECRET }}
      run: |
        $dbConn = $env:DB_CONN
        $seedPass = if ([string]::IsNullOrWhiteSpace($env:SEED_PASS)) { "AdminPassword123!" } else { $env:SEED_PASS }
        $hmacSec = if ([string]::IsNullOrWhiteSpace($env:HMAC_SECRET)) { "ProductionSecretKey_SaluExamPortal_2026_Secure" } else { $env:HMAC_SECRET }

        $config = @{
          "ConnectionStrings" = @{
            "DefaultConnection" = $dbConn
          }
          "Logging" = @{
            "LogLevel" = @{
              "Default" = "Information"
              "Microsoft.AspNetCore" = "Warning"
            }
          }
          "AllowedHosts" = "*"
          "SeedAdmin" = @{
            "Email" = "admin@salu.edu.pk"
            "Password" = $seedPass
          }
          "Security" = @{
            "AdmitCardHmacSecret" = $hmacSec
          }
        } | ConvertTo-Json -Depth 5
        Set-Content -Path ./publish/appsettings.Production.json -Value $config


    - name: Ensure logs folder exists
      shell: pwsh
      run: |
    - name: Verify FTP Credentials Presence
      shell: pwsh
      env:
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:FTP_PASS)) {
          Write-Error "CRITICAL: Secret 'FTP_PASSWORD' is EMPTY! Make sure it was added under 'Repository secrets' (at the bottom of the page), NOT 'Environment secrets'."
          exit 1
        }
        Write-Host "FTP_PASSWORD detected. Length is $($env:FTP_PASS.Length) characters."

    - name: Deploy via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: site86997.siteasp.net
        username: site86997
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: wwwroot/
        dangerous-clean-slate: false




